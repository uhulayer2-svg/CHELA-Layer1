<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHLA Scan | Block Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --primary: #fcd535;
            --secondary: #2b3139;
            --bg: #0b0e11;
            --card-bg: #1e2329;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --success: #0ecb81;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Header & Search */
        header {
            background-color: var(--card-bg);
            padding: 20px 50px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .search-container {
            flex-grow: 1;
            margin: 0 40px;
            max-width: 700px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #474d57;
            background-color: var(--bg);
            color: white;
            outline: none;
        }

        /* Dashboard Stats */
        .container {
            padding: 30px 50px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        /* Live Tables */
        .live-data-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .data-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .card-header {
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            background-color: rgba(255,255,255,0.02);
            padding: 12px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid #2b3139;
            font-size: 14px;
        }

        .hash-link {
            color: var(--primary);
            text-decoration: none;
            font-family: monospace;
        }

        .badge {
            background: var(--secondary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .amount {
            color: var(--success);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">CHLA <span style="color:white">SCAN</span></a>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="ค้นหาโดย Address / Txn Hash / Block Number...">
        </div>
        <div>
            <span class="badge">Mainnet (Local)</span>
        </div>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">บล็อกล่าสุด (Block Height)</div>
                <div class="stat-value" id="currentBlock">#0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Network Name</div>
                <div class="stat-value">CHELA-Layer1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Chain ID</div>
                <div class="stat-value">42</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Gas Price</div>
                <div class="stat-value">0.5 Gwei</div>
            </div>
        </div>

        <div class="live-data-container">
            <div class="data-card">
                <div class="card-header">Latest Blocks</div>
                <table>
                    <thead>
                        <tr>
                            <th>Block</th>
                            <th>Validator</th>
                            <th>Txs</th>
                        </tr>
                    </thead>
                    <tbody id="blockTable">
                        </tbody>
                </table>
            </div>

            <div class="data-card">
                <div class="card-header">Latest Transactions</div>
                <table>
                    <thead>
                        <tr>
                            <th>Tx Hash</th>
                            <th>From / To</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="txTable">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const RPC_URL = "http://127.0.0.1:9944";
        const provider = new ethers.providers.JsonRpcProvider(RPC_URL);

        async function updateExplorer() {
            try {
                const blockNumber = await provider.getBlockNumber();
                document.getElementById('currentBlock').innerText = "#" + blockNumber.toLocaleString();

                // 1. ดึงข้อมูล 6 บล็อกล่าสุด
                const blockTable = document.getElementById('blockTable');
                blockTable.innerHTML = '';
                for (let i = 0; i < 6; i++) {
                    const bNum = blockNumber - i;
                    if (bNum < 0) break;
                    
                    const block = await provider.getBlock(bNum);
                    const row = `
                        <tr>
                            <td><a href="#" class="hash-link">${bNum}</a></td>
                            <td><span class="badge">X99 Node</span></td>
                            <td>${block.transactions.length} Txs</td>
                        </tr>
                    `;
                    blockTable.innerHTML += row;

                    // 2. ดึงธุรกรรมล่าสุดจากบล็อก (ถ้ามี) มาโชว์ในตาราง Tx
                    if (i === 0 && block.transactions.length > 0) {
                        updateTxTable(block.transactions);
                    }
                }
            } catch (err) {
                console.error("RPC Connection Error:", err);
            }
        }

        async function updateTxTable(txHashes) {
            const txTable = document.getElementById('txTable');
            txTable.innerHTML = '';
            
            // แสดงผลแค่ 6 รายการล่าสุด
            const recentHashes = txHashes.slice(-6).reverse();
            
            for (let hash of recentHashes) {
                const tx = await provider.getTransaction(hash);
                const row = `
                    <tr>
                        <td><a href="#" class="hash-link">${hash.substring(0,10)}...</a></td>
                        <td>
                            <div style="font-size:11px; color:#848e9c">From: ${tx.from.substring(0,8)}...</div>
                            <div style="font-size:11px; color:#848e9c">To: ${tx.to ? tx.to.substring(0,8) : 'Contract'}...</div>
                        </td>
                        <td class="amount">${ethers.utils.formatEther(tx.value)} CHLA</td>
                    </tr>
                `;
                txTable.innerHTML += row;
            }
        }

        // รันครั้งแรก และตั้งให้รันทุกๆ 3 วินาที (Real-time)
        updateExplorer();
        setInterval(updateExplorer, 3000);

    </script>
</body>
</html>
